name: CI

on:
  push:
    branches: [main, dev, my_dev]
  pull_request:
    branches: [main, dev, my_dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ruff
        run: pip install ruff==0.14.0

      - name: Verificar lint
        run: ruff check .

  test:
    name: Tests (pytest + PostgreSQL + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: northwind_user
          POSTGRES_PASSWORD: northwind_password
          POSTGRES_DB: northwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: northwind_user
      DB_PASSWORD: northwind_password
      DB_NAME: northwind
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ci-only-secret-key-not-used-in-production
      APP_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cargar el esquema Northwind
        run: >
          psql "postgresql://northwind_user:northwind_password@localhost:5432/northwind"
          -f database/init.sql

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Ejecutar tests
        run: pytest tests/ --tb=short -p no:cacheprovider

  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar vulnerabilidades conocidas
        run: |
          pip install pip-audit
          pip-audit --progress-spinner=off -r requirements-ci.txt
